name: Test Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "App version, for example 1.0.0"
        required: true
      package_version:
        description: "Artifact label, for example 1.0.0-test-20260428"
        required: false
      build_number:
        description: "Build number override"
        required: false
      source_ref:
        description: "liujin0506/codux ref to build, for example main, v1.8.1, or a full 40-character commit SHA"
        required: false
        default: main
      configuration:
        description: "Flutter build mode"
        required: false
        default: Debug
        type: choice
        options:
          - Debug
          - Release
      build_apk:
        description: "Build the Android APK after the tests"
        required: false
        default: true
        type: boolean
      log_level:
        description: "CODUX_LOG_LEVEL"
        required: false
        default: debug
        type: choice
        options:
          - debug
          - info
          - warn
          - error
          - off

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    concurrency:
      group: mobile-test-build-${{ github.ref_name }}-${{ github.run_id }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          repository: liujin0506/codux
          ref: ${{ github.event.inputs.source_ref || 'main' }}
          token: ${{ secrets.CODUX_SOURCE_TOKEN }}

      - name: Set build working directory
        shell: bash
        run: echo "MOBILE_DIR=apps/mobile" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve build metadata
        id: meta
        shell: bash
        run: |
          version="${{ github.event.inputs.version }}"
          package_version="${{ github.event.inputs.package_version }}"
          build_number="${{ github.event.inputs.build_number }}"
          configuration="${{ github.event.inputs.configuration }}"

          if [[ -z "${version}" ]]; then
            echo "Build version is missing" >&2
            exit 1
          fi

          if [[ -z "${build_number}" ]]; then
            build_number="${GITHUB_RUN_NUMBER}"
          fi

          if [[ -z "${package_version}" ]]; then
            date_suffix="$(date +%Y%m%d)"
            if [[ "${configuration}" == "Debug" ]]; then
              package_version="${version}-debug-${date_suffix}"
            else
              package_version="${version}-test-${date_suffix}"
            fi
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "package_version=${package_version}" >> "$GITHUB_OUTPUT"
          echo "build_number=${build_number}" >> "$GITHUB_OUTPUT"
          echo "configuration=${configuration}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Analyze
        working-directory: apps/mobile
        run: flutter analyze

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Restore Rust cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: mobile-rust-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            mobile-rust-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            mobile-rust-${{ runner.os }}-

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Build Rust FFI for host tests
        shell: bash
        env:
          ZIG_GLOBAL_CACHE_DIR: ${{ runner.temp }}/zig-global-cache-host
          ZIG_LOCAL_CACHE_DIR: ${{ runner.temp }}/zig-local-cache-host
        run: |
          rm -rf "$ZIG_GLOBAL_CACHE_DIR" "$ZIG_LOCAL_CACHE_DIR"
          mkdir -p "$ZIG_GLOBAL_CACHE_DIR" "$ZIG_LOCAL_CACHE_DIR"
          cargo build -p codux-protocol-ffi --release
          echo "LD_LIBRARY_PATH=$PWD/target/release:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Test
        working-directory: apps/mobile
        run: flutter test

      - name: Install Android NDK
        if: ${{ inputs.build_apk }}
        shell: bash
        env:
          ANDROID_NDK_VERSION: "27.0.12077973"
        run: |
          sdkmanager_bin=""
          for candidate in \
            "${ANDROID_HOME:-}/cmdline-tools/latest/bin/sdkmanager" \
            "${ANDROID_SDK_ROOT:-}/cmdline-tools/latest/bin/sdkmanager" \
            "${ANDROID_HOME:-}/tools/bin/sdkmanager" \
            "${ANDROID_SDK_ROOT:-}/tools/bin/sdkmanager"; do
            if [[ -x "$candidate" ]]; then
              sdkmanager_bin="$candidate"
              break
            fi
          done
          if [[ -z "$sdkmanager_bin" ]]; then
            echo "sdkmanager was not found under ANDROID_HOME=${ANDROID_HOME:-} or ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}" >&2
            exit 1
          fi
          set +o pipefail
          yes | "$sdkmanager_bin" "ndk;${ANDROID_NDK_VERSION}"
          sdkmanager_status="${PIPESTATUS[1]}"
          set -o pipefail
          if [[ "$sdkmanager_status" -ne 0 ]]; then
            exit "$sdkmanager_status"
          fi
          android_sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          ndk_path="${android_sdk_root}/ndk/${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ndk_path}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ndk_path}" >> "$GITHUB_ENV"
          if [[ -d "${android_sdk_root}/ndk" ]]; then
            find "${android_sdk_root}/ndk" -mindepth 1 -maxdepth 1 -type d ! -name "${ANDROID_NDK_VERSION}" -exec rm -rf {} +
          fi

      - name: Install cargo-ndk
        if: ${{ inputs.build_apk }}
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Build Rust FFI for Android
        if: ${{ inputs.build_apk }}
        shell: bash
        env:
          ZIG_GLOBAL_CACHE_DIR: ${{ runner.temp }}/zig-global-cache-android
          ZIG_LOCAL_CACHE_DIR: ${{ runner.temp }}/zig-local-cache-android
        run: |
          rm -rf "$ZIG_GLOBAL_CACHE_DIR" "$ZIG_LOCAL_CACHE_DIR"
          mkdir -p "$ZIG_GLOBAL_CACHE_DIR" "$ZIG_LOCAL_CACHE_DIR"
          bash "$MOBILE_DIR/plugin/codux_protocol_ffi/scripts/build-android.sh"
          echo "CODUX_SKIP_ANDROID_FFI_BUILD=1" >> "$GITHUB_ENV"

      # Saved before Free disk space, which deletes the target directories the
      # next run wants to restore.
      - name: Save Rust cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: mobile-rust-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}

      - name: Restore Gradle cache
        if: ${{ inputs.build_apk }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: mobile-gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/android/**/*.gradle*', 'apps/mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            mobile-gradle-${{ runner.os }}-

      - name: Free disk space
        if: ${{ inputs.build_apk }}
        shell: bash
        run: |
          df -h /
          rm -rf target/debug target/release
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          df -h /

      - name: Build APK
        if: ${{ inputs.build_apk }}
        working-directory: apps/mobile
        shell: bash
        env:
          GRADLE_OPTS: -Dorg.gradle.vfs.watch=false -Dorg.gradle.daemon=false
        run: |
          mkdir -p dist
          if [[ "${{ steps.meta.outputs.configuration }}" == "Debug" ]]; then
            flutter build apk --debug \
              --build-name "${{ steps.meta.outputs.version }}" \
              --build-number "${{ steps.meta.outputs.build_number }}" \
              --dart-define "CODUX_LOG_LEVEL=${{ github.event.inputs.log_level }}"
            cp build/app/outputs/flutter-apk/app-debug.apk "dist/Codux-Mobile-${{ steps.meta.outputs.package_version }}-android-debug.apk"
          else
            flutter build apk --release --split-per-abi \
              --build-name "${{ steps.meta.outputs.version }}" \
              --build-number "${{ steps.meta.outputs.build_number }}" \
              --dart-define "CODUX_LOG_LEVEL=${{ github.event.inputs.log_level }}"
            cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/Codux-Mobile-${{ steps.meta.outputs.package_version }}-android-release.apk"
          fi
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - name: Upload workflow artifact
        if: ${{ inputs.build_apk }}
        uses: actions/upload-artifact@v4
        with:
          name: codux-mobile-${{ steps.meta.outputs.package_version }}-manual
          path: |
            apps/mobile/dist/*.apk
            apps/mobile/dist/SHA256SUMS.txt
          if-no-files-found: error
